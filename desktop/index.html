<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>MemoryBridge - AISP Command Center</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0d1117;
        color: #c9d1d9;
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      h1 {
        color: #58a6ff;
      }
      .dashboard {
        background-color: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 2rem;
        text-align: center;
        width: 80%;
        max-width: 800px;
      }
      .stats {
        display: flex;
        justify-content: space-around;
        margin-top: 2rem;
      }
      .stat-card {
        background-color: #21262d;
        padding: 1.5rem;
        border-radius: 6px;
        width: 30%;
      }
      .stat-value {
        font-size: 2rem;
        font-weight: bold;
        color: #7ee787;
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <h1>MemoryBridge Workspace</h1>
      <p>Universal AI Session Protocol (AISP) Daemon is running locally.</p>
      
      <div class="stats">
        <div class="stat-card">
          <div class="stat-value">3</div>
          <div>Active Sessions</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">1,204</div>
          <div>Snapshots Created</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">14.2 MB</div>
          <div>Saved Sync Data</div>
        </div>
      </div>
    </div>
  </body>
</html>
